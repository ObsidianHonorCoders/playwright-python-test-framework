name: UI tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install -r pyenv/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Start demo app
        run: |
          python -m app.server > app.log 2>&1 &
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:8000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat app.log
          exit 1
      - name: Run UI tests
        run: mkdir -p reports && python -m pytest --html=reports/report.html --self-contained-html --junitxml=reports/junit.xml
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-and-failures
          path: |
            reports/
            test-results/
